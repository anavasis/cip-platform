name: Architecture Guard

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture-guard:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Display PHP version
        run: php -v

      - name: Run Architecture Guard
        run: php .github/architecture-guard/check.php

      - name: Run Static Safety Check
        run: php tests/static-safety-check.php

      - name: Run CIP-002 Foundation Smoke Test
        run: php tests/cip002-foundation-smoke.php

      - name: Run CIP-003A Acquisition Platform Smoke Test
        run: php tests/cip003a-acquisition-platform-smoke.php

      - name: Run CIP-003B Acquisition Engine Smoke Test
        run: php tests/cip003b-acquisition-engine-smoke.php

      - name: Run CIP-003C Source Check Integration Smoke Test
        run: php tests/cip003c-source-check-integration-smoke.php

      - name: Run CIP-003D Collector Activation Smoke Test
        run: php tests/cip003d-collector-activation-smoke.php

      - name: Run CIP-003E Evidence Diagnostics Smoke Test
        run: php tests/cip003e-evidence-diagnostics-smoke.php

      - name: Run CIP-004 Acquisition Capability Smoke Test
        run: php tests/cip004-acquisition-capability-smoke.php

      - name: Run CIP-005 Production Orchestrator Smoke Test
        run: php tests/cip005-production-orchestrator-smoke.php

      - name: Run Editorial Spine Phase 1 Smoke Test
        run: php tests/editorial-spine-phase1-smoke.php

      - name: Run Editorial Workspace Phase 2 Smoke Test
        run: php tests/editorial-workspace-phase2-smoke.php

      - name: Run BUILD-001 Content Blueprint Smoke Test
        run: php tests/build001-content-blueprint-smoke.php

      - name: Run BUILD-002 Prompt Context Smoke Test
        run: php tests/build002-prompt-context-smoke.php

      - name: Run BUILD-003 Prompt Package Smoke Test
        run: php tests/build003-prompt-package-smoke.php

      - name: Run BUILD-004 Generation Request Smoke Test
        run: php tests/build004-generation-request-smoke.php

      - name: Run BUILD-005 Generation Result Smoke Test
        run: php tests/build005-generation-result-smoke.php

      - name: Run Editorial Slice A Smoke Test
        run: php tests/editorial-slice-a-smoke.php

      - name: Run Delivery Core Smoke Test
        run: php tests/delivery-core-smoke.php
