name: Architecture Guard

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture-guard:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Display PHP version
        run: php -v

      - name: Run Architecture Guard
        run: php .github/architecture-guard/check.php

      - name: Run Static Safety Check
        run: php tests/static-safety-check.php

      - name: Run CIP-002 Foundation Smoke Test
        run: php tests/cip002-foundation-smoke.php

      - name: Run CIP-003A Acquisition Platform Smoke Test
        run: php tests/cip003a-acquisition-platform-smoke.php

      - name: Run CIP-003B Acquisition Engine Smoke Test
        run: php tests/cip003b-acquisition-engine-smoke.php

      - name: Run CIP-003C Source Check Integration Smoke Test
        run: php tests/cip003c-source-check-integration-smoke.php

      - name: Run CIP-003D Collector Activation Smoke Test
        run: php tests/cip003d-collector-activation-smoke.php

      - name: Run CIP-003E Evidence Diagnostics Smoke Test
        run: php tests/cip003e-evidence-diagnostics-smoke.php
